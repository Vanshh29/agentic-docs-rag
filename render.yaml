# Public recorded demo on Render: one Docker web service built from ./Dockerfile.demo.
# The image replays answers recorded with scripts/record_demo.py, so it needs no secrets, makes
# no model calls and cannot run up an API bill. It uses about 150 MB of RAM, which fits the free
# plan; free services sleep after 15 minutes without traffic and take a short while to wake up.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: docs-assistant-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    plan: free
    healthCheckPath: /health
