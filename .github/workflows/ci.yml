name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the (billable) evaluation job"
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src eval
      - run: pytest

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    needs: checks
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: python -m docrag.ingest --path data/samples --reset
      - run: python -m eval.run_eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
